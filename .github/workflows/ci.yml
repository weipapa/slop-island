name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build & test
        run: |
          xcodebuild test \
            -project SlopIsland.xcodeproj \
            -scheme SlopIsland \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
